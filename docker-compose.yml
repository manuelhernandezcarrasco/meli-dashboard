services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pnl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pnl}
      POSTGRES_DB: ${POSTGRES_DB:-pnl}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pnl}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pnl}:${POSTGRES_PASSWORD:-pnl}@db:5432/${POSTGRES_DB:-pnl}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data:ro

volumes:
  pgdata:
