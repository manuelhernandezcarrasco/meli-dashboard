services:
  - type: web
    name: pnl-diario-ml
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL # Neon connection string (include ?sslmode=require)
        sync: false
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      - key: ML_REDIRECT_URI # https://<service>.onrender.com/api/auth/callback
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY # also used as a Docker build arg
        sync: false
      - key: DATA_SOURCE
        value: live
      - key: CRON_SECRET # shared with the stock-reconcile cron job below
        sync: false

  # Stock reconcile safety net (S4): calls the web service every 15 minutes.
  - type: cron
    name: pnl-stock-reconcile
    runtime: image
    image:
      url: docker.io/curlimages/curl:8.10.1
    schedule: "*/15 * * * *"
    dockerCommand: sh -c 'curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/stock-reconcile"'
    envVars:
      - key: APP_URL # https://<service>.onrender.com
        sync: false
      - key: CRON_SECRET
        sync: false
